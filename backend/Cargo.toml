[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.2", features = ["cors"] }

# Complete Candle Core + Hugging Face ecosystem bindings
candle-core = "0.8.4"
candle-transformers = "0.8.4"
hf-hub = "0.4.0"
tokenizers = "0.15.2"